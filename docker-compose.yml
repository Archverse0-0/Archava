services:
  token-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archava-token-server
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  agent-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    container_name: archava-agent-worker
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      token-server:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
        # Leave empty to use the same-origin `/api/getToken` path, which the
        # nginx config inside this image proxies to `token-server`. It only
        # needs a value when the frontend is served from another origin. Vite
        # bakes this in at build time, so changing it requires a rebuild —
        # setting it as a runtime `environment:` entry has no effect on the
        # bundle. See DEPLOY_GUIDE.md.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: archava-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      token-server:
        condition: service_healthy

networks:
  default:
    name: archava-network
