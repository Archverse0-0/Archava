[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# The Python sources live entirely under backend/. Foundry vendored dependencies
# (contracts/lib/**) contain helper scripts that shadow each other's module
# names, so they are excluded from type checking rather than silenced.
files = ["backend"]
ignore_missing_imports = true
exclude = [
    "^contracts/",
    "^\\.venv/",
    "^node_modules/",
]
