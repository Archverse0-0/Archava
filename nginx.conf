server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in error pages / Server header.
    server_tokens off;

    # ---------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------
    # IMPORTANT nginx behaviour: `add_header` directives are inherited from the
    # server block ONLY by locations that do not declare any `add_header` of
    # their own. The static-asset and health locations below each declare one
    # (Cache-Control / Content-Type), so they used to silently lose every
    # header defined here — including the CSP — which is exactly where a
    # browser spends most of its requests. Those two locations therefore
    # re-declare this same set. If you add a header here, add it there too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection is deliberately NOT set: the legacy auditor is removed
    # from every current browser and in old ones it introduced vulnerabilities
    # of its own. CSP below is the actual control.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # Strict-Transport-Security is commented out on purpose: this server block
    # terminates plain HTTP on port 80 only. TLS is expected to be terminated
    # upstream (Vercel, a load balancer, or a reverse proxy in front of this
    # container). If you move TLS termination into this container, set
    # `listen 443 ssl` and enable the header with a real max-age.

    # Content-Security-Policy.
    #
    # This is NOT a "strong" CSP and must not be described as one:
    #   * style-src keeps 'unsafe-inline' because the app sets inline React
    #     style props (LiveKitWidget.jsx) and RainbowKit/Radix inject <style>
    #     tags. CSP nonces and hashes do not cover style *attributes*.
    #   * img-src allows any https origin because wallet logos are served from
    #     whatever hosts the WalletConnect registry returns.
    #   * The LiveKit host is a literal because nginx has no access to Vite's
    #     build-time env vars. If VITE_LIVEKIT_URL changes, change it here too.
    #
    # What it does remove: 'unsafe-eval' and 'unsafe-inline' from script-src
    # (the production bundle contains neither eval() nor inline scripts), and
    # the unused cdn.jsdelivr.net / js.stripe.com origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.coingecko.com https://api.web3modal.org https://registry.walletconnect.com https://explorer-api.walletconnect.com https://rpc.walletconnect.org wss://receptionist-lwypqvqa.livekit.cloud wss://relay.walletconnect.com wss://relay.walletconnect.org https://testnet-rpc.monad.xyz https://testnet.monadexplorer.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    # Note: text/xml is listed once. nginx's gzip_types does not merge with its
    # built-in defaults, but a duplicate entry is a warning at startup.
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Re-declared because this location has its own add_header; see the
        # note at the top of the server block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.coingecko.com https://api.web3modal.org https://registry.walletconnect.com https://explorer-api.walletconnect.com https://rpc.walletconnect.org wss://receptionist-lwypqvqa.livekit.cloud wss://relay.walletconnect.com wss://relay.walletconnect.org https://testnet-rpc.monad.xyz https://testnet.monadexplorer.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to token server. The trailing slash on proxy_pass strips the
    # `/api` prefix, so the browser's `/api/getToken` reaches the Flask route
    # `/getToken`. This is the same-origin path the frontend uses by default;
    # see DEPLOY_GUIDE.md for the cross-origin VITE_API_BASE_URL variant.
    location /api/ {
        proxy_pass http://token-server:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint.
    #
    # `default_type` rather than `add_header Content-Type`: nginx resolves the
    # response type for `return` from default_type, so add_header would emit a
    # second, conflicting Content-Type alongside it.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
        # Re-declared because this location has its own add_header; see the
        # note at the top of the server block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.coingecko.com https://api.web3modal.org https://registry.walletconnect.com https://explorer-api.walletconnect.com https://rpc.walletconnect.org wss://receptionist-lwypqvqa.livekit.cloud wss://relay.walletconnect.com wss://relay.walletconnect.org https://testnet-rpc.monad.xyz https://testnet.monadexplorer.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;
    }
}
